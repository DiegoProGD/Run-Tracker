<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
@font-face {
    font-family: "Pusab";
    src: url("./PUSAB___.otf") format("opentype");
}

body{
    margin:0;
    width:100vw;
    height:100vh;
    background:#00FF00; /* greenscreen */
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

input{
    padding:10px;
    width:500px;
    max-width:90%;
    font-size:24px;
}

#text{
    margin-top:20px;
    font-family:"Pusab", sans-serif;
    font-size:100px;
    color:white;
    text-align:center;
}
</style>
</head>
<body>

<input id="input" placeholder="Type something...">
<div id="text">TEXT</div>

<script>
const input = document.getElementById("input");
const text = document.getElementById("text");

input.addEventListener("input", () => {
    text.textContent = input.value || "TEXT";
});
</script>

</body>
</html>
