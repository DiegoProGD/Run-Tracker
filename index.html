<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
@font-face {
    font-family: "Pusab";
    src: url("PUSAB___.otf") format("opentype");
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: #00FF00;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Invisible textbox */
#input {
    position: absolute;
    left: -9999px;
}

#text {
    font-family: "Pusab", sans-serif;
    font-size: 120px;
    color: white;
    text-align: center;
    max-width: 95vw;
    word-wrap: break-word;

    text-shadow:
        -6px -6px 0 #000,
         6px -6px 0 #000,
        -6px  6px 0 #000,
         6px  6px 0 #000,
         0px -6px 0 #000,
         0px  6px 0 #000,
        -6px  0px 0 #000,
         6px  0px 0 #000;
}
</style>
</head>
<body>

<input id="input" type="text" autofocus>
<div id="text">CLICK AND TYPE</div>

<script>
const input = document.getElementById("input");
const text = document.getElementById("text");

document.body.addEventListener("click", () => {
    input.focus();
});

input.addEventListener("input", () => {
    text.textContent = input.value || " ";
});

input.focus();
</script>

</body>
</html>
