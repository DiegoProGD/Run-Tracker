<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
@font-face {
    font-family: "Pusab";
    src: url("PUSAB___.otf") format("opentype");
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: #00FF00;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#text {
    font-family: "Pusab", sans-serif;
    font-size: 120px;
    color: white;
    text-align: center;
    
    text-shadow:
        -5px -5px 0 #000,
         5px -5px 0 #000,
        -5px  5px 0 #000,
         5px  5px 0 #000,
         0px -5px 0 #000,
         0px  5px 0 #000,
        -5px  0px 0 #000,
         5px  0px 0 #000;
}
</style>
</head>
<body>

<div id="text"></div>

<script>
document.getElementById("text").textContent =
    prompt("Enter text:") || "TEXT";
</script>

</body>
</html>
